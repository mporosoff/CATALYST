name: Desktop application
on:
  push:
    branches: [main]
    paths:
      - 'catalyst_desktop/**'
      - 'catalyst_ingest/**'
      - 'mappings/**'
      - 'tests/**'
      - 'scripts/*desktop*'
      - 'requirements-desktop*.txt'
      - 'docs/desktop*.md'
      - 'docs/consortium-workflow.md'
      - 'docs/scisure-integration-review.md'
      - 'docs/scisure-configuration.*'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
          check-latest: true
      - name: Install credential and packaging libraries
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements-desktop-build.txt
      - name: Check published dependency advisories
        run: python scripts/audit-desktop-dependencies.py
      - name: Test synthetic ingestion and transfer workflows
        run: python -m unittest discover -s tests -v
      - name: Test native desktop widgets
        run: python scripts/test-desktop-gui.py
      - name: Package native desktop app
        run: python scripts/build-desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: CATALYST-${{ runner.os }}-${{ runner.arch }}
          path: |
            desktop-dist/CATALYST-Windows.exe
            desktop-dist/CATALYST-Mac-*.dmg
            desktop-dist/dependency-audit-*.json
          if-no-files-found: error
          retention-days: 30
